title: Evolvable Labs
subtitle: '진화로 생명과 지능이 생겨나는 과정을 공부하고 실험합니다'
description: '인공생명(Artificial Life) 공부와 재현 실험 기록'
keywords: artificial life, open-ended evolution, digital evolution, GPU
author: Evolvable Labs
language: ko
timezone: Asia/Seoul
url: https://sean-jang00.github.io
permalink: :year/:month/:title/
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:
  - 'sims/**'
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: icarus
deploy:
  type: ''

# RSS
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20

# 글 안의 상대 경로 이미지(![..](a.png))를 글의 자산 폴더로 해석한다. 초안을 일반 마크다운 뷰어에서도 볼 수 있게 하기 위해서다.
marked:
  prependRoot: true
  postAsset: true
